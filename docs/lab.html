<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Lab</title>
  <style>
    .container {
      display: flex;
      align-items: flex-start;
      padding: 20px;
      border: 2px solid #aaa;
      margin: 30px;
      max-width: 800px;
      width: 100%;
      box-sizing: border-box;
      background-color: #ffffff;
    }

    .container img {
      margin-right: 20px;
    }

    .text {
      max-width: 800px;
      margin-left:30px
    }

    .text h1 {
      margin-top: 0;
    }

    .text p {
        margin: 0.1em 0;
    }
    .spacing {
      margin: 1em 0;
    }

    .inner-divider {
      height: 2px;
      background-color: #ccc;
      margin: 10px 0;
    }
    
    .divider {
      height: 4px;
      background-color: #ffffff;
      border-bottom: 2px solid #aaa;
      margin: 20px 0;
      box-shadow: inset 0 1px 0 #ccc;
    }
    .custom-bullets {
      list-style: none;
      padding-left: 0;
    }

    .custom-bullets li {
      position: relative;
      padding-left: 30px;
      margin-bottom: 0.5em;
    }

    .custom-bullets li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      background-image: url('https://contemporary-home-computing.org/prof-dr-style/bg/image003.gif');
      background-size: contain;
      background-repeat: no-repeat;
    }

    body {
      background-image: url('https://contemporary-home-computing.org/prof-dr-style/bg/wpaper.gif');
      background-repeat: repeat;   
      background-attachment: fixed;
      background-size: auto;       
      margin: 0;                   
      padding: 0;
    }

    /* Chrome/Edge/Safari */
    ::-webkit-scrollbar {
      width: 16px;
    }

    ::-webkit-scrollbar-track {
      background: #dcdcdc;
      border: 1px solid #aaa;
    }

    ::-webkit-scrollbar-thumb {
      background: #b0b0b0;
      border: 2px solid #dcdcdc;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #909090;
    }

    /* Firefox */
    * {
      scrollbar-width: auto;
      scrollbar-color: #b0b0b0 #dcdcdc;
    }

    .sidebar {
      width: 220px;
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      background-color: #eee;
      border-right: 2px solid #aaa;
      padding: 30px 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .sidebar ul {
      list-style: none;
      padding-left: 0;
      margin: 0;
    }

    .sidebar li {
      margin-bottom: 0.8em;
    }

    .sidebar li a {
      text-decoration: none;
      color: #000000;
      font-size: 16px;
      font-family: inherit;
    }

    .sidebar > ul > li > a {
      font-weight: bold;
    }

    .sidebar ul ul {
      margin-top: 0.5em;
      padding-left: 20px;
    }

    .sidebar ul ul li {
      margin-bottom: 0.5em;
    }
    
    .sidebar ul ul li a {
       font-size: 15px;
       font-weight: normal;
    }

    .main-content {
      margin-left: 220px;
    }


    @media (max-width: 1081px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 2px solid #aaa;
        margin-bottom: 0;
      }

      .main-content {
        margin-left: 0;
      }
      
      .container {
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 80%;
        margin: 0 auto;
        margin-top: 30px
      }

      .container img {
        width: 35vw;     
        height: auto;    
        margin-right: 0;
        margin-bottom: 20px;
      }

      .text {
        max-width: 90%;   
        margin: 0 auto;   
        text-align: center;
        font-size: 16px;  
      }

      .text h1 {
        font-size: 24px;  
      }

    }
  </style>
</head>
<body>

      <li><a href="lab.html">Lab</a></li>
        <ul>
          <li><a href="#work">Work with us!</a></li>
        </ul>
    </ul>
  </div>

  <div class="main-content">

    </div>
  
    <div class="divider"></div>
  
    <div class="text" style="text-align:center;">
      <p>
        <img src="http://textfiles.com/underconstruction/HoHollywoodBungalow4907imgsourcesunderconstruction.gif" alt="Under Construction animated GIF" width="300">
      </p>
      <p>&nbsp;<p>     
      <p>Please note the lab website is currently under construction! Come back soon for more info</p>
    </div>
  

  </div> </body>
</html>
